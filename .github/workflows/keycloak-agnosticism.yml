name: keycloak-agnosticism

# Provider-agnosticism proof: drive the bridge -> consume roundtrip against a
# real, non-Entra OIDC session minted by a dockerized Keycloak via a genuine
# auth-code + PKCE (S256) flow. This catches any accidental Entra-specific
# coupling in the bridge mechanics. Entra itself is exercised live on the Vercel
# preview, never in CI, so this job carries no Entra credentials.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  keycloak-roundtrip:
    runs-on: ubuntu-latest

    env:
      KEYCLOAK_BASE_URL: http://localhost:8080
      KEYCLOAK_REALM: bridge-agnosticism
      KEYCLOAK_CLIENT_ID: bridge-test-client
      KEYCLOAK_REDIRECT_URI: http://localhost:3000/auth/callback/keycloak
      KEYCLOAK_USERNAME: bridge-test-user
      KEYCLOAK_PASSWORD: bridge-test-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Keycloak
        # Run Keycloak as a plain `docker run` rather than a service container:
        # the image's entrypoint (kc.sh) needs a `start`/`start-dev` command,
        # which a `services:` block cannot express. `start-dev` runs HTTP dev
        # mode (no hostname/TLS requirement) and `--import-realm` imports the
        # committed realm-export from the mounted import dir in one shot.
        # Pin a known-good 26.x tag rather than `latest`.
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HEALTH_ENABLED=true \
            -v "${{ github.workspace }}/examples/tenant-app/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0.7 \
            start-dev --import-realm

      - name: Wait for Keycloak readiness
        # Poll the management readiness endpoint explicitly so the job fails loud
        # if Keycloak never comes up rather than racing into the test. On timeout,
        # dump the container logs so the failure is diagnosable.
        run: |
          echo "Polling Keycloak readiness at :9000/health/ready ..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1; then
              echo "Keycloak is ready."
              exit 0
            fi
            echo "  not ready yet (attempt $i) ..."
            sleep 5
          done
          echo "Keycloak did not become ready in time." >&2
          docker logs keycloak || true
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        # Build packages/core so the example's `next-auth-bridge` import (and its
        # ./store/kv subpath) resolves against the published exports map before
        # the example test runs.
        run: pnpm --filter next-auth-bridge build

      - name: Run Keycloak roundtrip test
        run: pnpm --filter tenant-app-example test

      - name: Dump Keycloak logs on failure
        if: failure()
        run: docker logs keycloak || true
