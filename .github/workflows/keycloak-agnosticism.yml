name: keycloak-agnosticism

# Provider-agnosticism proof: drive the bridge -> consume roundtrip against a
# real, non-Entra OIDC session minted by a dockerized Keycloak via a genuine
# auth-code + PKCE (S256) flow. This catches any accidental Entra-specific
# coupling in the bridge mechanics. Entra itself is exercised live on the Vercel
# preview, never in CI, so this job carries no Entra credentials.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  keycloak-roundtrip:
    runs-on: ubuntu-latest

    # Pin a known-good Keycloak 26.x tag rather than `latest`, and enable the
    # health endpoints so the readiness poll below has something to hit. The
    # realm is imported at startup from the committed export.
    services:
      keycloak:
        image: quay.io/keycloak/keycloak:26.0.7
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
          KC_HEALTH_ENABLED: "true"
          KC_HTTP_ENABLED: "true"
        ports:
          - 8080:8080
          - 9000:9000
        # GitHub Actions service containers cannot take extra CLI args, so the
        # default entrypoint runs `start`. The realm is imported in an explicit
        # step below via the Keycloak admin REST API instead of --import-realm
        # at boot (which would require a custom command the service block cannot
        # express). See the "Import realm" step.
        options: >-
          --health-cmd "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\nhost: localhost\n\n' >&3 && cat <&3 | grep -q UP"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      KEYCLOAK_BASE_URL: http://localhost:8080
      KEYCLOAK_REALM: bridge-agnosticism
      KEYCLOAK_CLIENT_ID: bridge-test-client
      KEYCLOAK_REDIRECT_URI: http://localhost:3000/auth/callback/keycloak
      KEYCLOAK_USERNAME: bridge-test-user
      KEYCLOAK_PASSWORD: bridge-test-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Keycloak readiness
        # Do not rely solely on the container HEALTHCHECK — poll the management
        # readiness endpoint explicitly so the job fails loud if Keycloak never
        # comes up rather than racing into the import.
        run: |
          echo "Polling Keycloak readiness at :9000/health/ready ..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1; then
              echo "Keycloak is ready."
              exit 0
            fi
            echo "  not ready yet (attempt $i) ..."
            sleep 5
          done
          echo "Keycloak did not become ready in time." >&2
          exit 1

      - name: Import realm
        # Import the committed realm-export through the admin REST API. The
        # service block cannot pass `--import-realm` to the container command, so
        # we authenticate as the bootstrap admin and POST the realm. Idempotent:
        # a pre-existing realm (409) is treated as success.
        run: |
          set -euo pipefail
          REALM_FILE=examples/tenant-app/keycloak/realm-export.json
          echo "Obtaining admin token ..."
          TOKEN=$(curl -fsS -X POST \
            http://localhost:8080/realms/master/protocol/openid-connect/token \
            -d "client_id=admin-cli" \
            -d "username=admin" \
            -d "password=admin" \
            -d "grant_type=password" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          echo "Importing realm from ${REALM_FILE} ..."
          STATUS=$(curl -s -o /tmp/import-body -w "%{http_code}" -X POST \
            http://localhost:8080/admin/realms \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data @"${REALM_FILE}")
          echo "Import HTTP status: ${STATUS}"
          if [ "${STATUS}" != "201" ] && [ "${STATUS}" != "409" ]; then
            echo "Realm import failed:" >&2
            cat /tmp/import-body >&2
            exit 1
          fi
          echo "Realm import-realm step complete (status ${STATUS})."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        # Build packages/core so the example's `next-auth-bridge` import (and its
        # ./store/kv subpath) resolves against the published exports map before
        # the example test runs.
        run: pnpm --filter next-auth-bridge build

      - name: Run Keycloak roundtrip test
        run: pnpm --filter tenant-app-example test
